# Only the HTTP test server used by the extension's end-to-end tests.
[workspace]
resolver = "3"
members = ["crates/ydm-testserver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
