<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YDM</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <span class="mark">YDM</span>
      <span id="summary" class="summary" aria-live="polite"></span>
      <button id="settings" class="icon" title="Impostazioni" aria-label="Impostazioni">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6" />
          <circle cx="10" cy="4.5" r="1.5" />
          <circle cx="6" cy="11.5" r="1.5" />
        </svg>
      </button>
      <input type="checkbox" id="enabled" class="switch" role="switch" aria-label="YDM attivo" title="YDM attivo" />
    </header>
    <p id="off" class="off" hidden>YDM è spento: i download li fa il browser.</p>
    <ul id="list"></ul>
    <div id="empty" class="empty">
      <p>Nessun download per ora.</p>
      <p class="hint" id="hint"></p>
    </div>
    <footer>
      <button id="clear" class="link" hidden>Togli dalla lista i finiti</button>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
