name: Release

# Fully automatic: raise "version" in extension/package.json and merge to
# main. When CI has passed, this workflow tags the commit and publishes a
# GitHub release with:
#
#   YDM-Setup-<v>.exe        Windows installer: pick Firefox and/or Chrome
#   ydm-<v>-firefox.xpi      Firefox add-on signed by Mozilla; installs and
#                            updates itself from this repository
#   ydm-<v>-chrome.zip       Chrome/Edge/Brave, to load unpacked
#   ydm-<v>-sources.zip      the sources Mozilla reviews
#   updates.json             what Firefox checks for updates
#
# YDM is distributed from GitHub only, not from the browsers' stores.
# Signing the Firefox add-on needs the secrets FIREFOX_JWT_ISSUER and
# FIREFOX_JWT_SECRET (free API keys of an addons.mozilla.org account);
# without them the release has no Firefox add-on and the installer offers
# Chrome only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      YDM_REPO: ${{ github.repository }}
    outputs:
      new: ${{ steps.version.outputs.new }}
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.firefox.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Is this a new version?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released; nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - if: steps.version.outputs.new == 'true'
        run: npm ci

      - name: Chrome build and sources
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx wxt zip
          npx wxt zip -b firefox
          mkdir -p dist
          cp ".output/ydm-extension-$VERSION-chrome.zip" "dist/ydm-$VERSION-chrome.zip"
          cp ".output/ydm-extension-$VERSION-sources.zip" "dist/ydm-$VERSION-sources.zip"

      - name: Firefox add-on, signed, updating itself from GitHub
        id: firefox
        if: steps.version.outputs.new == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::warning::No Firefox add-on in this release: set the FIREFOX_JWT_ISSUER and FIREFOX_JWT_SECRET secrets"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          YDM_SELF_HOSTED=1 npx wxt build -b firefox
          npx web-ext lint --self-hosted --source-dir .selfhosted/firefox-mv2 --warnings-as-errors
          npx web-ext sign --channel unlisted --source-dir .selfhosted/firefox-mv2 \
            --artifacts-dir .selfhosted/signed --upload-source-code "dist/ydm-$VERSION-sources.zip"
          cp "$(ls .selfhosted/signed/*.xpi | head -1)" "dist/ydm-$VERSION-firefox.xpi"
          node -e '
            const v = process.env.VERSION, repo = process.env.YDM_REPO;
            const crypto = require("crypto"), fs = require("fs");
            const file = `dist/ydm-${v}-firefox.xpi`;
            const hash = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            const updates = { addons: { "ydm@yamantau": { updates: [{
              version: v,
              update_link: `https://github.com/${repo}/releases/download/v${v}/ydm-${v}-firefox.xpi`,
              update_hash: `sha256:${hash}`,
            }] } } };
            fs.writeFileSync("dist/updates.json", JSON.stringify(updates, null, 2));
          '
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Payload for the installer
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p payload
          cp -r .output/chrome-mv3 payload/chrome
          if [ -f "dist/ydm-$VERSION-firefox.xpi" ]; then cp "dist/ydm-$VERSION-firefox.xpi" payload/ydm-firefox.xpi; fi

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          name: release
          path: |
            extension/dist
            extension/payload

  installer:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: extension

      - name: Build YDM-Setup.exe
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          REPO: ${{ github.repository }}
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $defs = @("/DVersion=$env:VERSION", "/DPayload=..\extension\payload", "/DRepo=$env:REPO")
          if ($env:SIGNED -ne 'true') { $defs += '/DNoFirefox' }
          & $iscc /Q @defs installer\ydm.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "extension\.output\YDM-Setup-$env:VERSION.exe" extension\dist\

      - name: Installer works, silently, both ways
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $dir = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'YDM'
          $p = Start-Process "extension\dist\YDM-Setup-$env:VERSION.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/BROWSERS=chrome' -PassThru
          if (-not $p.WaitForExit(120000)) { throw 'installer hung' }
          if ($p.ExitCode) { throw "installer exit $($p.ExitCode)" }
          if (-not (Test-Path "$dir\chrome\manifest.json")) { throw 'Chrome files missing' }
          $u = Start-Process (Get-ChildItem "$dir\unins*.exe")[0].FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru
          if (-not $u.WaitForExit(120000)) { throw 'uninstaller hung' }
          Start-Sleep 3
          if (Test-Path "$dir\chrome") { throw 'uninstall left files' }

      - name: Tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # The description of what YDM does and how to install it, with this
          # version's file names; GitHub adds the list of changes after it.
          sed "s/{version}/$VERSION/g" store/release-notes.md > notes.md
          gh release create "v$VERSION" extension/dist/* --target "$SHA" --title "YDM $VERSION" \
            --notes-file notes.md --generate-notes
